packages:
  - apps/*
  - packages/*

allowBuilds:
  electron: true
  esbuild: true
  # Hooks are installed by the root `prepare` script instead.
  lefthook: false

minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.44"
  - "@tanstack/router-core@1.171.37"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4
  - zod@4.6.7
  - electron@44.7.1
