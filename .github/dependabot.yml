# Monthly version updates, minor and patch grouped into one PR per ecosystem; majors come one PR each. Security
# updates come as soon as there's an alert (turned on by scripts/github-setup.ts). Titles are Conventional, which
# the commitlint check needs: `chore(deps): …` and `ci(deps): …`. How it fits together: docs/features/github-setup.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Like pnpm's minimumReleaseAge: let a release sit a few days before taking it.
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node we run (engines and CI: 24), not the newest one: newer types offer APIs that
      # don't exist at runtime. Bump this major together with the Node version.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
