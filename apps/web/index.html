<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicons/a-card.svg" />
    <title>%BRAND_NAME%</title>
    <script>
      // Paint the stored theme and appearance before first paint (pattern from T3 Code's index.html). The app
      // writes the snapshots read here (hooks/useTheme.ts, theme/appearance.ts) and re-applies once it loads.
      (function () {
        var root = document.documentElement;
        function stored(key) {
          try {
            return JSON.parse(localStorage.getItem(key) || "null");
          } catch (e) {
            return null;
          }
        }
        try {
          var mode = localStorage.getItem("%STORAGE_KEY(theme)%");
          if (mode !== "light" && mode !== "system") mode = "dark";
          var wanted =
            mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          var paint = stored("%STORAGE_KEY(theme-paint)%");
          var entry = paint && paint[wanted];
          var appearance =
            entry && (entry.appearance === "light" || entry.appearance === "dark") ? entry.appearance : wanted;
          var dark = appearance === "dark";
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          if (entry && typeof entry.id === "string" && entry.vars) {
            root.setAttribute("data-theme-id", entry.id);
            for (var name in entry.vars) {
              if (name.indexOf("--app-theme-") === 0) root.style.setProperty(name, String(entry.vars[name]));
            }
          }
          root.style.backgroundColor = (entry && entry.background) || (dark ? "#0a0a0a" : "#fcfcfc");
        } catch (e) {}
        try {
          var look = stored("%STORAGE_KEY(appearance-paint)%");
          if (look && look.style) {
            for (var prop in look.style) {
              if (prop.indexOf("--") === 0 || prop === "font-size")
                root.style.setProperty(prop, String(look.style[prop]));
            }
          }
          if (look && look.data) {
            for (var key in look.data) {
              if (/^[a-z-]+$/.test(key)) root.setAttribute("data-" + key, String(look.data[key]));
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
